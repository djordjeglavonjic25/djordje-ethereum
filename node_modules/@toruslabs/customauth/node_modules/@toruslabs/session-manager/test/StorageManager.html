<!--
  To run the test, you need to run the following command:
  npx vite .
  This will start a development server at http://localhost:5173/
  then open the browser and go to http://localhost:5173/test/storageManager.html
  you should see the test result in the console.
  This is a simple test to verify that the session-manager library is working in the browser.
  It will generate a random session key and create a session.
  It will then log the result to the console.
  If the session is created successfully, it will log the session ID to the console.
  If the session creation fails, it will log the error to the console.
-->
<!doctype html>
<html>
  <head>
    <title>Storage Manager Test</title>
  </head>

  <body>
    <script type="module">
      // Now import session-manager
      const { StorageManager } = await import("../dist/lib.esm/index.js");

      console.log("StorageManager:", StorageManager);

      const sessionId = StorageManager.generateRandomSessionKey();
      console.log("Generated session key:", sessionId);

      const storageManager = new StorageManager({
        sessionId,
        sessionServerBaseUrl: "https://api.web3auth.io/session-service",
      });

      storageManager
        .createSession({ test: "data" })
        .then((result) => console.log("Session created:", result))
        .catch((error) => console.error("Session creation failed:", error));
    </script>
  </body>
</html>
